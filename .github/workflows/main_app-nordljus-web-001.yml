name: Build and deploy HTML app to Azure Web App - app-nordljus-web-001

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-nordljus-web-001'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_765D9820ACFF4EE18BE3D43B06DA710D }}
